name: Release

on:
  push:
    tags:
      - "v*" # e.g. v0.1.0

permissions:
  contents: write # needed to create the GitHub Release and upload assets

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: git-branch-manager

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `platform` is what users see in asset names. The rust target triple
          # is a build detail and reads badly in a download list
          # ("x86_64-unknown-linux-gnu" — the "unknown" is the vendor field).
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            archive: tar.gz
          # Statically linked against musl: one file, no libc dependency at all,
          # so it runs on any x86-64 Linux regardless of how old its glibc is.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform: linux-x86_64-static
            archive: tar.gz
            musl: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            archive: zip
          # macOS universal: built from these two and merged with lipo below.
          - os: macos-latest
            target: aarch64-apple-darwin
            extra_target: x86_64-apple-darwin
            universal: true
            platform: macos-universal
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Add second macOS target
        if: matrix.universal
        run: rustup target add ${{ matrix.extra_target }}

      # libgit2 is vendored and compiled from C, so the musl target needs a musl
      # C toolchain; the cc crate picks up musl-gcc automatically from here.
      - name: Install musl toolchain
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build second macOS arch
        if: matrix.universal
        run: cargo build --release --locked --target ${{ matrix.extra_target }}

      # ---- Package -------------------------------------------------------
      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          staging="${BIN_NAME}-${version}-${{ matrix.platform }}"
          mkdir -p "dist/${staging}"

          if [ "${{ matrix.universal }}" = "true" ]; then
            # Merge the two arch binaries into one universal binary.
            lipo -create -output "dist/${staging}/${BIN_NAME}" \
              "target/${{ matrix.target }}/release/${BIN_NAME}" \
              "target/${{ matrix.extra_target }}/release/${BIN_NAME}"
          else
            cp "target/${{ matrix.target }}/release/${BIN_NAME}" "dist/${staging}/"
          fi

          cp README.md LICENSE* "dist/${staging}/" 2>/dev/null || true
          tar -C dist -czf "${staging}.tar.gz" "${staging}"
          echo "ASSET=${staging}.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME
          $staging = "$env:BIN_NAME-$version-${{ matrix.platform }}"
          New-Item -ItemType Directory -Path "dist/$staging" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/$env:BIN_NAME.exe" "dist/$staging/"
          if (Test-Path README.md) { Copy-Item README.md "dist/$staging/" }
          Get-ChildItem -Filter "LICENSE*" | ForEach-Object { Copy-Item $_.FullName "dist/$staging/" }
          Compress-Archive -Path "dist/$staging" -DestinationPath "$staging.zip"
          "ASSET=$staging.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          # Prepended to the auto-generated notes. Two Linux assets need a word
          # of explanation, and this is where people actually look.
          body: |
            ### Which Linux download?

            | Asset | Requires |
            | --- | --- |
            | `…-linux-x86_64.tar.gz` | a reasonably current **glibc** (built on Ubuntu) |
            | `…-linux-x86_64-static.tar.gz` | **nothing** — statically linked, runs on any x86-64 Linux |

            Take the `-static` one if the other reports
            `version 'GLIBC_x.yz' not found`.
